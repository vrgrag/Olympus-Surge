# Lint on a four-module project with Compose needs considerably more
# metaspace than the compile does; 384m ran the daemon dry mid-analysis.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseSerialGC -Dfile.encoding=UTF-8
kotlin.daemon.jvm.options=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC
org.gradle.parallel=false
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
# Windows file-lock guard for paths with spaces (pitfalls §5).
kotlin.incremental=false
